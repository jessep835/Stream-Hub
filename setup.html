<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>STREAM HUB Setup</title>
<link rel="stylesheet" href="setup.css">
</head>
<body>
<div id="setup">
    <div id="card">
        <img 
        src="assets-2/schoollogo.jpg" 
        id="logo"
        >
        <div id="title">
            STREAM HUB
        </div>
        <div id="subtitle">
            First Launch Detected
        </div>
        <div id="systemStatus">
            Initializing workspace...
        </div>
        <div id="progress">
            <span class="active"></span>
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div id="content">
            <h1>
                Welcome.
            </h1>
            <p>
                Before we begin,
                what should we call you?
            </p>
            <input 
            id="nameInput"
            placeholder="Enter your name..."
            autocomplete="off"
            >
            <button id="continueBtn">
                Continue →
            </button>
        </div>
    </div>
</div>
<script src="setup.js"></script>
</body>
</html>
