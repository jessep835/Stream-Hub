<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Calculator</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}
html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0b0b0b;
    display:flex;
    justify-content:center;
    align-items:center;
}
.calc{
    width:340px;
    background:#171717;
    border-radius:22px;
    padding:20px;
    box-shadow:
        0 25px 60px rgba(0,0,0,.55),
        0 0 30px rgba(0,240,255,.12);
}
.logo{
    text-align:center;
    color:#00f0ff;
    font-size:24px;
    font-weight:700;
    letter-spacing:4px;
    margin-bottom:18px;
}
#display{
    width:100%;
    height:72px;
    border:none;
    outline:none;
    background:#0d0d0d;
    color:white;
    border-radius:14px;
    padding:0 18px;
    text-align:right;
    font-size:34px;
    margin-bottom:18px;
}
.keys{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}
button{
    height:68px;
    border:none;
    border-radius:14px;
    background:#252525;
    color:white;
    font-size:24px;
    cursor:pointer;
    transition:.18s;
}
button:hover{
    background:#00f0ff;
    color:black;
    transform:translateY(-2px);
}
.equal{
    background:#00c8ff;
    color:black;
    font-weight:700;
}
.clear{
    background:#aa2b2b;
}
</style>
</head>
<body>
<div class="calc">
    <div class="logo">
        STREAM HUB
    </div>
    <input id="display" readonly>
    <div class="keys">
    <button onclick="press('1')">1</button>
    <button onclick="press('2')">2</button>
    <button onclick="press('3')">3</button>
    <button onclick="press('4')">4</button>
    <button onclick="press('5')">5</button>
    <button onclick="press('6')">6</button>
    <button onclick="press('7')">7</button>
    <button onclick="press('8')">8</button>
    <button onclick="press('9')">9</button>
    <button class="clear" onclick="clearPin()">C</button>
    <button onclick="press('0')">0</button>
    <button class="equal" onclick="check()">=</button>
</div>
</div>
<script>
const { ipcRenderer } = require("electron");
const fs = require("fs");
const path = require("path");
const profilePath = path.join(
    process.env.APPDATA,
    "stream",
    "profile.json"
);
let SECRET_PIN = null;
try{
    const profile = JSON.parse(
        fs.readFileSync(profilePath)
    );
    SECRET_PIN = profile.pin;
}
catch(err){
    console.log("Could not load PIN:", err);
}
let value = "";
const display = document.getElementById("display");
function press(num){
    if(value.length >= 4) return;
    value += num;
    display.value = value.replace(/./g,"•");
}
function clearPin(){
    value = "";
    display.value = "";
}
function check(){
    if(value === SECRET_PIN){
        ipcRenderer.send("unlock");
    }else{
        display.value = "ERROR";
        setTimeout(clearPin,700);
    }
}
document.addEventListener("keydown",(e)=>{
    if(e.key >= "0" && e.key <= "9"){
        press(e.key);
    }
    if(e.key === "Backspace"){
        value = value.slice(0,-1);
        display.value = value.replace(/./g,"•");
    }
    if(e.key === "Enter"){
        check();
    }
    if(e.key === "Escape"){
        clearPin();
    }
});
</script>
</body>
</html>
